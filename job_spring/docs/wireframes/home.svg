<svg xmlns="http://www.w3.org/2000/svg" width="743" height="636" viewBox="0 0 743 636" role="img" aria-labelledby="title desc">
  <title id="title">用户主页草图结构转录</title>
  <desc id="desc">右上方为昵称，主页主体为纵向岗位卡片，每张卡片右侧有状态圆点与文字，右下角为添加按钮。</desc>
  <rect width="743" height="636" fill="white"/>
  <g fill="none" stroke="black" stroke-width="12" stroke-linejoin="round">
    <rect x="42" y="128" width="652" height="465"/>
    <rect x="583" y="42" width="117" height="68"/>
    <rect x="69" y="152" width="580" height="93"/>
    <rect x="69" y="276" width="566" height="99"/>
    <rect x="67" y="405" width="574" height="80"/>
    <rect x="545" y="520" width="118" height="51"/>
    <circle cx="582" cy="207" r="16"/>
  </g>
  <g font-family="sans-serif" fill="black" font-size="16">
    <text x="100" y="76">主页面，登录之后自动跳转到当前页面</text>
    <text x="600" y="76">个人昵称区域</text>
    <text x="90" y="197">每个岗位的记录，点击之后跳转到</text>
    <text x="90" y="216">岗位状态、面试经历、岗位详情页面</text>
    <text x="412" y="176">不同状态用不同颜色标识，</text>
    <text x="412" y="195">填充右边圆圈，状态文字在下方</text>
    <text x="557" y="237" font-size="13">状态文字</text>
    <text x="574" y="551" font-size="13">添加按钮</text>
    <text x="43" y="623" fill="#777" font-size="12">依据对话附件转录 · 2026-10-18</text>
  </g>
</svg>
