worker_processes 1;
pid run/nginx.pid;
error_log stderr;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path run/client-body;
    proxy_temp_path run/proxy;
    fastcgi_temp_path run/fastcgi;
    uwsgi_temp_path run/uwsgi;
    scgi_temp_path run/scgi;

    server {
        listen 127.0.0.1:18080;
        server_name localhost 127.0.0.1;
        root /opt/job-tracker-nginx-preview/frontend;
        index index.html;

        include /opt/job-tracker-nginx-preview/job-tracker.locations.conf;
    }
}
