server:
  # 额度按连接来源计算，暂不信任客户端提供的转发头；可信代理策略在 5.6 完善。
  forward-headers-strategy: none
  port: 8082
  tomcat:
    # 为略超 6 MiB 的拒绝请求保留有限的丢弃空间，使客户端能收到 413。
    max-swallow-size: 8MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      # 合法请求在内存内处理，不将上传内容写入临时磁盘文件。
      file-size-threshold: 6MB
  application:
    name: job_spring
  config:
    # IDEA 运行配置的 Working directory 应为本项目根目录。
    # 本地密码文件放在 resources 之外，不随应用打包。
    import:
      - optional:file:./config/application-local.yaml
      - optional:file:./config/vision-quota-local.yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/job_tracker?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
    username: root
    # 本机由上述本地文件覆盖；其他环境可通过 DB_PASSWORD 提供。
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  sql:
    init:
      # 表已手动建立，启动时不执行建表或数据初始化脚本。
      mode: never

vision:
  quota:
    daily-limit: ${VISION_QUOTA_DAILY_LIMIT:5}
    # 至少 32 字节的随机密钥；为空时仅额度不可用，不影响手动岗位功能。
    hmac-secret: ${VISION_QUOTA_HMAC_SECRET:}
