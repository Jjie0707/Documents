server:
  # 保持原始连接来源，由额度 Service 按显式可信代理配置解析 IP。
  forward-headers-strategy: none
  port: 8082
  tomcat:
    # 为略超 6 MiB 的拒绝请求保留有限的丢弃空间，使客户端能收到 413。
    max-swallow-size: 8MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      # 合法请求在内存内处理，不将上传内容写入临时磁盘文件。
      file-size-threshold: 6MB
  application:
    name: job_spring
  config:
    # IDEA 运行配置的 Working directory 应为本项目根目录。
    # 本地密码文件放在 resources 之外，不随应用打包。
    import:
      - optional:file:./config/application-local.yaml
      - optional:file:./config/vision-quota-local.yaml
      - optional:file:./config/vision-model-local.yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/job_tracker?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
    username: root
    # 本机由上述本地文件覆盖；其他环境可通过 DB_PASSWORD 提供。
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  sql:
    init:
      # 表已手动建立，启动时不执行建表或数据初始化脚本。
      mode: never

vision:
  model:
    # 仅支持两款已核查免费视觉型号，不自动切换或重试。
    name: ${VISION_MODEL_NAME:glm-4.1v-thinking-flash}
    enabled: ${VISION_MODEL_ENABLED:false}
    api-key: ${VISION_MODEL_API_KEY:}
    timeout-seconds: ${VISION_MODEL_TIMEOUT_SECONDS:45}
  quota:
    daily-limit: ${VISION_QUOTA_DAILY_LIMIT:30}
    global-daily-limit: ${VISION_QUOTA_GLOBAL_DAILY_LIMIT:300}
    # 默认不信任转发头；配置前须保证请求只能经指定代理进入。
    trusted-proxies: []
    # 至少 32 字节的随机密钥；为空时仅额度不可用，不影响手动岗位功能。
    hmac-secret: ${VISION_QUOTA_HMAC_SECRET:}
