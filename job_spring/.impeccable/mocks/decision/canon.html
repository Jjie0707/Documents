<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岗位投递记录 · 现代工具界面</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#24314a;background:#fff;font-synthesis:none;--blue:#2563eb;--muted:#667085;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font-size:16px}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2563eb}::selection{background:#dbeafe;color:#173b82}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}a{text-decoration:none;color:inherit}
.shell{display:grid;grid-template-columns:244px 1fr;height:100%}.sidebar{background:#f2f4f7;padding:35px 20px 24px;display:flex;flex-direction:column;border-right:1px solid #e9edf2}.brand{display:flex;gap:12px;align-items:center;margin:0 8px 48px}.brand-mark{width:36px;height:40px;background:#2563eb;color:white;display:grid;place-items:center;border-radius:9px}.brand-name{font-size:19px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}.brand-en{font-size:14px;letter-spacing:.06em;color:#667085;margin-top:4px}.nav{display:grid;gap:9px}.nav a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:8px;font-weight:550;color:#536078}.nav a.active{background:#e3ebfc;color:#1e54c8}.nav a:hover{background:#e8edf4}.nav a.active:hover{background:#dae6fc}.account{margin-top:auto;border-top:1px solid #dfe5ed;padding:24px 9px 0;display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#dce4f0;color:#4b5d77;display:grid;place-items:center}.account-name{font-size:15px;font-weight:600}.account-note{font-size:14px;color:#667085;margin-top:4px}
main{padding:40px 48px 0;background:#fff;position:relative}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:30px;letter-spacing:-.025em;line-height:1.3;margin:0 0 10px;font-weight:700}.intro{color:#667085;margin:0;font-size:16px}.button{height:44px;padding:0 20px;border:1px solid #d8dee8;border-radius:8px;color:#344054;background:white;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:550;white-space:nowrap}.button:hover{background:#f8fafc}.primary{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 2px 3px #1f4fb91c}.primary:hover{background:#1d4ed8}.add{padding:0 19px;height:46px}.add svg{width:18px;height:18px}
.filters{display:flex;align-items:flex-end;gap:14px;padding:18px 24px;background:#f8fafc;border-radius:12px;margin-bottom:25px}.field{display:grid;gap:10px}.field label{font-size:14px;font-weight:550;color:#475467}.search-field{flex:1}.input-wrap{position:relative}.input-wrap svg{position:absolute;left:14px;top:12px;color:#7a879c}input,select{height:44px;border:1px solid #d8dee8;border-radius:7px;color:#344054;background:#fff}input{padding:0 14px 0 43px;width:100%;caret-color:#2563eb}input::placeholder{color:#667085;opacity:1}select{padding:0 40px 0 14px;width:176px}.filter-actions{display:flex;gap:10px}.filter-actions .primary{padding:0 23px}
.list-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.list-title{font-size:19px;margin:0;font-weight:650}.count{font-size:14px;color:#667085}.count strong{font-weight:600;color:#344054;margin:0 3px}.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed}thead{background:#f8fafc;text-align:left}th{height:48px;font-size:14px;color:#667085;font-weight:550}th:first-child{padding-left:24px}td{height:96px;border-top:1px solid var(--line);vertical-align:middle;font-size:16px}tbody tr:hover{background:#fbfcff}.job{padding-left:24px;display:flex;align-items:center;gap:15px;height:96px}.company-symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#eef3fd;color:#4266a4;font-size:18px;font-weight:600}.company-symbol.teal{background:#eaf5f3;color:#39796c}.company-symbol.sand{background:#faf2e7;color:#8d6c40}.company-symbol.purple{background:#f1edfa;color:#77629e}.job-name{font-weight:600;line-height:1.5;white-space:nowrap}.company{font-size:14px;color:#667085;margin-top:6px}.salary{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.city{color:#475467}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:6px;font-size:14px;font-weight:550;white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.interview{background:#fff5e4;color:#926214}.sent{background:#edf3ff;color:#285ab4}.pending{background:#f0f2f5;color:#5c6879}.offer{background:#e8f6ee;color:#28764b}.pagination{display:flex;justify-content:space-between;align-items:center;padding-top:23px;font-size:14px;color:#667085}.pages{display:flex;align-items:center;gap:10px}.page-button{width:34px;height:34px;border:1px solid #e1e6ee;border-radius:7px;background:#fff;color:#98a2b3;display:grid;place-items:center}.page-button svg{width:16px;height:16px}.page-button.current{background:#edf3ff;border-color:#dbe7ff;color:#2563eb;font-size:14px;font-weight:600}.page-button:disabled{cursor:default;background:#fafbfc;color:#b4bdcb}.page-size{margin-right:8px;color:#667085}.preview-note{position:absolute;bottom:22px;left:48px;right:48px;text-align:center;color:#667085;font-size:14px}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M4 12a20 20 0 0 0 16 0M10 13h4"/></svg></div><div><div class="brand-name">岗位投递记录</div><div class="brand-en">JOB TRACKER</div></div></div>
  <nav class="nav" aria-label="主导航">
    <a class="active" href="#applications" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>岗位投递</a>
    <a href="#add-job"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加岗位</a>
  </nav>
  <div class="account"><div class="avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg></div><div><div class="account-name">个人演示账号</div><div class="account-note">个人空间</div></div></div>
</aside>
<main id="applications">
  <header class="heading"><div><h1>岗位投递</h1><p class="intro">管理岗位信息，记录每一次投递进展。</p></div><a class="button primary add" id="add-job" href="#add-job"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加岗位</a></header>
  <form class="filters" action="#applications">
    <div class="field search-field"><label for="keyword">关键词</label><div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="keyword" name="keyword" placeholder="搜索公司、岗位或城市"></div></div>
    <div class="field"><label for="status">投递状态</label><select id="status" name="status"><option>全部状态</option><option>待投递</option><option>已投递</option><option>面试中</option><option>已获Offer</option></select></div>
    <div class="filter-actions"><button class="button primary" type="submit">搜索</button><button class="button" type="reset">重置</button></div>
  </form>
  <div class="list-top"><h2 class="list-title">岗位列表</h2><div class="count">共<strong>4</strong>条记录</div></div>
  <div class="table-wrap"><table aria-label="岗位投递列表">
    <colgroup><col style="width:45%"><col style="width:12%"><col style="width:25%"><col style="width:18%"></colgroup>
    <thead><tr><th scope="col">岗位 / 公司</th><th scope="col">工作城市</th><th scope="col">薪资待遇</th><th scope="col">投递状态</th></tr></thead>
    <tbody>
      <tr><td><div class="job"><div class="company-symbol">星</div><div><div class="job-name">Java 后端开发工程师</div><div class="company">星河科技（虚构）</div></div></div></td><td class="city">杭州</td><td class="salary">18–25K·14薪</td><td><span class="status interview">面试中</span></td></tr>
      <tr><td><div class="job"><div class="company-symbol teal">青</div><div><div class="job-name">服务端研发工程师</div><div class="company">青屿数字（虚构）</div></div></div></td><td class="city">上海</td><td class="salary">20–30K·13薪</td><td><span class="status sent">已投递</span></td></tr>
      <tr><td><div class="job"><div class="company-symbol sand">远</div><div><div class="job-name">Java 开发实习生</div><div class="company">远山云端（虚构）</div></div></div></td><td class="city">北京</td><td class="salary">250–350元每天</td><td><span class="status pending">待投递</span></td></tr>
      <tr><td><div class="job"><div class="company-symbol purple">微</div><div><div class="job-name">平台研发工程师</div><div class="company">微光信息（虚构）</div></div></div></td><td class="city">深圳</td><td class="salary">薪资面议</td><td><span class="status offer">已获Offer</span></td></tr>
    </tbody>
  </table></div>
  <div class="pagination"><span>显示 1–4 条，共 4 条</span><div class="pages"><span class="page-size">每页 10 条</span><button class="page-button" type="button" disabled aria-label="上一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button class="page-button current" type="button" aria-current="page">1</button><button class="page-button" type="button" disabled aria-label="下一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>
  <footer class="preview-note">风格预览 · 虚构数据 · 未连接后端</footer>
</main>
</div>
</body>
</html>
