<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信号黄 · 明确行动｜岗位投递记录</title>
<style>
:root{--yellow:#f4cc35;--ink:#161b23;--muted:#60656d;--ground:#f2f3f4;--line:#e4e6e9;--white:#fff}
*{box-sizing:border-box}html,body{width:1440px;height:900px;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button,a,select{cursor:pointer}button{border:0}a{text-decoration:none;color:inherit}
::selection{background:var(--yellow);color:var(--ink)}:focus-visible{outline:3px solid var(--ink);outline-offset:4px}input{caret-color:var(--ink)}
.topbar{height:100px;background:var(--yellow);display:flex;align-items:center;padding:0 64px;gap:72px}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}.brand-mark{width:38px;height:38px}.brand-name{font-size:22px;font-weight:750;line-height:1.35;letter-spacing:-.02em}.brand-en{font-size:14px;letter-spacing:.09em;font-weight:650;line-height:1.5}
.navigation{display:flex;align-self:stretch;gap:38px;align-items:stretch}.navigation a{display:flex;align-items:center;position:relative;font-weight:600}.navigation .active:after{content:"";height:4px;background:var(--ink);position:absolute;bottom:0;left:0;right:0}
.account{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.account svg{width:22px;height:22px}
main{width:1280px;margin:30px auto 0}.page-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:32px;line-height:1.3;margin:0 0 7px;letter-spacing:-.025em;font-weight:750}.page-heading p{margin:0;color:var(--muted);font-size:16px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;background:var(--ink);color:var(--white);border-radius:6px;font-weight:650}.primary svg{width:20px;height:20px}.primary:hover{background:#303640}
.workspace{background:var(--white);border-radius:10px;overflow:hidden}
.filters{display:flex;align-items:flex-end;gap:16px;padding:26px 28px 28px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:9px}.field label{font-size:14px;font-weight:650}.keyword{width:440px}.status-filter{width:232px}
.input-wrap{position:relative}.input-wrap svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:#686d75}
input,select{height:46px;width:100%;border:1px solid #b9bec5;border-radius:5px;background:var(--white);padding:0 14px;outline-offset:3px}input{padding-left:44px}input::placeholder{color:#6a6f77;opacity:1}
.search,.reset{height:46px;border-radius:5px;padding:0 23px;font-weight:600}.search{background:var(--yellow);color:var(--ink)}.search:hover{background:#e9bd20}.reset{background:var(--white);border:1px solid #b9bec5}.reset:hover{background:var(--ground)}
.filter-hint{font-size:14px;color:var(--muted);margin:0 0 12px auto;white-space:nowrap}
table{width:100%;border-collapse:collapse;table-layout:fixed}th{height:49px;background:#f7f8f9;text-align:left;font-size:14px;font-weight:600;color:#565d66}th:first-child,td:first-child{padding-left:28px}th:last-child,td:last-child{padding-right:28px}
td{height:92px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:16px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfc}
.job-title{font-size:17px;font-weight:650;margin-bottom:5px;letter-spacing:-.01em}.company{font-size:14px;color:var(--muted)}.salary{font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;font-size:14px;line-height:28px;padding:0 10px;border-radius:4px;font-weight:600;white-space:nowrap}.interview{background:#fff2c1;color:#6b4a00}.sent{background:#eaf0fa;color:#294e85}.waiting{background:#eff0f2;color:#535a64}.offer{background:#e7f3ec;color:#286043}
.action-head,.action-cell{background:#fffbea}.action-head{color:var(--ink)}.action-cell a{display:inline-block;font-weight:650;font-size:14px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}.action-cell a:hover{background:var(--yellow)}
.pagination{height:72px;display:flex;align-items:center;gap:18px;padding:0 28px;border-top:1px solid var(--line);font-size:14px}.count{color:var(--muted)}.page-controls{margin-left:auto;display:flex;align-items:center;gap:12px}.page-size{width:104px;height:36px;font-size:14px;padding:0 10px}.pager{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #d7dbe0;background:var(--white);border-radius:4px}.pager svg{width:17px;height:17px}.pager:disabled{color:#a4a9b1;background:#f8f9fa;cursor:default}.pager.current{background:var(--yellow);border-color:var(--yellow);font-weight:700}.page-label{margin-right:4px;color:var(--muted)}
footer{width:1280px;display:flex;justify-content:space-between;margin:18px auto 0;color:#676d75;font-size:14px}.preview-note{display:flex;align-items:center;gap:8px}.preview-note:before{content:"";display:block;width:7px;height:7px;background:#8b9199;border-radius:50%}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" aria-label="岗位投递记录首页">
    <svg class="brand-mark" viewBox="0 0 38 38" fill="none" aria-hidden="true"><rect x="2" y="2" width="34" height="34" rx="5" stroke="currentColor" stroke-width="2.5"/><path d="M11 12h16M11 19h10M11 26h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div><div class="brand-name">岗位投递记录</div><div class="brand-en">JOB TRACKER</div></div>
  </a>
  <nav class="navigation" aria-label="主导航"><a class="active" href="#" aria-current="page">岗位投递</a><a href="#">添加岗位</a></nav>
  <div class="account"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 21v-2.5a7 7 0 0 1 14 0V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>演示账号</div>
</header>
<main>
  <div class="page-heading"><div><h1>岗位投递</h1><p>整理岗位信息，跟进每一次投递。</p></div><button class="primary" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>添加岗位</button></div>
  <section class="workspace" aria-label="岗位列表">
    <form class="filters" action="#">
      <div class="field keyword"><label for="keyword">搜索岗位</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="keyword" type="search" placeholder="输入公司名称或岗位名称"></div></div>
      <div class="field status-filter"><label for="status">投递状态</label><select id="status"><option>全部状态</option><option>待投递</option><option>已投递</option><option>面试中</option><option>已获Offer</option></select></div>
      <button class="search" type="button">搜索</button><button class="reset" type="reset">重置</button><p class="filter-hint">当前为虚构数据预览</p>
    </form>
    <table>
      <colgroup><col style="width:38%"><col style="width:11%"><col style="width:22%"><col style="width:17%"><col style="width:12%"></colgroup>
      <thead><tr><th scope="col">岗位 / 公司</th><th scope="col">城市</th><th scope="col">薪资</th><th scope="col">投递状态</th><th class="action-head" scope="col">操作</th></tr></thead>
      <tbody>
        <tr><td><div class="job-title">Java 后端开发工程师</div><div class="company">星河科技（虚构）</div></td><td>杭州</td><td class="salary">18–25K·14薪</td><td><span class="badge interview">面试中</span></td><td class="action-cell"><a href="#">编辑岗位</a></td></tr>
        <tr><td><div class="job-title">服务端研发工程师</div><div class="company">青屿数字（虚构）</div></td><td>上海</td><td class="salary">20–30K·13薪</td><td><span class="badge sent">已投递</span></td><td class="action-cell"><a href="#">编辑岗位</a></td></tr>
        <tr><td><div class="job-title">Java 开发实习生</div><div class="company">远山云端（虚构）</div></td><td>北京</td><td class="salary">250–350元每天</td><td><span class="badge waiting">待投递</span></td><td class="action-cell"><a href="#">编辑岗位</a></td></tr>
        <tr><td><div class="job-title">平台研发工程师</div><div class="company">微光信息（虚构）</div></td><td>深圳</td><td class="salary">薪资面议</td><td><span class="badge offer">已获Offer</span></td><td class="action-cell"><a href="#">编辑岗位</a></td></tr>
      </tbody>
    </table>
    <div class="pagination"><span class="count">共 4 条预览记录</span><div class="page-controls"><label for="page-size">每页</label><select class="page-size" id="page-size"><option>10 条</option><option>20 条</option><option>50 条</option></select><span class="page-label">第 1 / 1 页</span><button class="pager" type="button" disabled aria-label="上一页"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="pager current" type="button" aria-current="page">1</button><button class="pager" type="button" disabled aria-label="下一页"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
  </section>
</main>
<footer><span>风格预览 · 虚构数据 · 未连接后端</span><span class="preview-note">此页面仅用于视觉方向选择</span></footer>
</body>
</html>
